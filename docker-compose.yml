services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: document_processor
      POSTGRES_USER: document_processor
      POSTGRES_PASSWORD: document_processor
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - document_processor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_processor -d document_processor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  document_processor_postgres:

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DocumentProcessor.sln

      - name: Build Release
        run: dotnet build DocumentProcessor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DocumentProcessor.sln --configuration Release --no-build --no-restore

      - name: Audit NuGet vulnerabilities
        run: dotnet list DocumentProcessor.sln package --vulnerable --include-transitive
